<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maker — Reels (сцена)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<!--
  Ролик для Instagram Reels, 1080×1920, 15 с, 120 BPM (доля 0,5 с).
  Референс: ScreenRecording_10-02-2026 20-21-45_1.MP4 — «Think FAST / Can't find your iPhone? (it happens)».
  render(t) рисует кадр на любую секунду; ?t=3.2 — заморозить кадр, без параметров — играет по кругу.
  Безопасная зона Reels: текст и важное — между 300 и 1500 px по высоте.
-->
<style>
:root{--ink:#0A0A0A;--blue:#1F5BFF;--paper:#F2F2F0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
body{font-family:Onest,system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:grid;place-items:center}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--paper);transform-origin:50% 50%;flex:none}
.l{position:absolute;inset:0}
#word{position:absolute;left:0;right:0;top:640px;text-align:center;font-weight:800;letter-spacing:-.045em;line-height:1;color:var(--ink);white-space:nowrap;z-index:5}
.caret{display:inline-block;width:.07em;height:.86em;background:var(--ink);margin-left:.05em;vertical-align:-.06em}
#giant{position:absolute;font-weight:900;letter-spacing:-.06em;line-height:.8;color:var(--ink);white-space:nowrap;z-index:2}
#circle{position:absolute;border-radius:50%;background:var(--ink);z-index:2}
#echo{position:absolute;left:50%;top:760px;z-index:4}
.stk{position:absolute;display:flex;align-items:center;justify-content:center;gap:24px;font-weight:900;font-style:normal;letter-spacing:-.04em;color:#fff;background:var(--blue);border:6px solid var(--ink);white-space:nowrap}
.stk.ghost{color:var(--ink)}
#cards{position:absolute;left:50%;top:860px;z-index:4}
.cd{position:absolute;width:640px;height:800px;border-radius:40px;overflow:hidden;background:#fff;border:6px solid var(--ink);box-shadow:0 30px 60px -20px rgba(0,0,0,.35)}
.cd img{width:100%;height:100%;object-fit:cover}
.cd .ui{position:absolute;inset:0;background-repeat:no-repeat}
.cd .tg{position:absolute;left:28px;top:28px;height:64px;padding:0 26px 0 18px;border-radius:20px;background:#fff;display:flex;align-items:center;gap:12px;font-weight:700;font-size:30px;color:#0B1230;box-shadow:0 10px 24px -10px rgba(0,0,0,.4)}
.cd .tg svg{width:36px;height:36px}
#logo{position:absolute;left:50%;top:600px;z-index:6;display:flex;flex-direction:column;align-items:center;gap:40px;transform-origin:50% 30%}
#url{font-weight:700;font-size:96px;letter-spacing:-.03em;color:var(--ink);white-space:nowrap}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="mkBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1F6FFF"/><stop offset="1" stop-color="#0A55E6"/></linearGradient>
  <linearGradient id="mkF" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#F4F8FF"/><stop offset="1" stop-color="#BFD3FF"/></linearGradient>
  <linearGradient id="mkM" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".62"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".34"/></linearGradient>
  <linearGradient id="mkB" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".46"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".2"/></linearGradient>
  <symbol id="mk-logo" viewBox="0 0 100 100">
    <rect width="100" height="100" rx="22" fill="url(#mkBg)"/>
    <g transform="skewY(18)">
      <rect x="48" y="-0.6" width="36" height="39" rx="6.5" fill="url(#mkB)"/>
      <rect x="30.5" y="14" width="36" height="39" rx="6.5" fill="url(#mkM)"/>
      <rect x="13" y="28.5" width="36" height="39" rx="6.5" fill="url(#mkF)"/>
    </g>
  </symbol>
</defs></svg>

<div id="stage">
  <div class="l" id="bg"></div>
  <div id="circle"></div>
  <div id="giant"></div>
  <div id="echo"></div>
  <div id="cards"></div>
  <div id="word"></div>
  <div id="logo"><svg viewBox="0 0 100 100" width="300" height="300"><use href="#mk-logo"/></svg><div style="font-weight:800;font-size:170px;letter-spacing:-.04em;color:#141A2A;line-height:1">maker</div><div id="url"></div></div>
</div>

<script>
const $=id=>document.getElementById(id);
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const eExpo=p=>p>=1?1:1-Math.pow(2,-10*p);
const eOut=p=>1-Math.pow(1-p,3);
const eBack=p=>{const c=1.7;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2)};
const DUR=15;
const LOGO='<svg viewBox="0 0 100 100"><use href="#mk-logo"/></svg>';

/* ---- карточки для шлейфа: настоящие материалы и экраны прототипа ---- */
const CARDS=[
  ['ui','ui/plan.jpg',2.6,8,14,'Контент-план'],
  ['ui','ui/banners.jpg',2.4,40,62,'Баннеры'],
  ['img','../img/intro/01-stories.jpg',0,0,0,'Сторис'],
  ['ui','ui/style.jpg',2.4,72,42,'Стиль'],
  ['img','../img/intro/03-carousel.jpg',0,0,0,'Карусель'],
  ['post','','',0,0,'Пост'],
];
(function(){
  $('cards').innerHTML=CARDS.map((c,i)=>{
    let inner='';
    if(c[0]==='ui')inner=`<div class="ui" style="background-image:url(${c[1]});background-size:${c[2]*100}% auto;background-position:${c[3]}% ${c[4]}%"></div>`;
    else if(c[0]==='img')inner=`<img src="${c[1]}">`;
    else inner=`<div style="position:absolute;inset:0;background:#F3F6F2"><img src="../img/leaf.jpg" style="position:absolute;right:-40px;top:0;height:100%;width:62%;object-fit:cover"><div style="position:absolute;left:44px;top:150px;font-size:84px;line-height:1.04;font-weight:800;color:#111;letter-spacing:-.03em">Забота<br>в каждой<br>детали</div><div style="position:absolute;left:44px;bottom:56px;height:96px;padding:0 44px;border-radius:48px;background:#1F5BFF;color:#fff;display:flex;align-items:center;font-weight:700;font-size:34px">Записаться</div></div>`;
    return `<div class="cd" id="cd${i}">${inner}<div class="tg">${LOGO}${c[5]}</div></div>`;
  }).join('');
})();

/* ---- слои ---- */
function reset(dark){
  $('bg').style.background=dark?'#000':'var(--paper)';
  $('word').innerHTML='';$('word').style.color=dark?'#fff':'var(--ink)';$('word').style.transform='';$('word').style.top='640px';
  $('giant').style.display='none';$('circle').style.display='none';$('echo').innerHTML='';
  $('cards').style.display='none';$('logo').style.display='none';
}
function word(text,lt,size=210,o={}){
  const w=$('word');w.style.fontSize=size+'px';
  w.innerHTML=text+(o.caret?`<span class="caret" style="opacity:${o.blink===false||Math.floor(lt/.2)%2===0?1:0}"></span>`:'');
  if(o.top)w.style.top=o.top+'px';
  w.style.transform=o.still?'':`scale(${1.05-.05*eExpo(seg(lt,0,.18))})`;
}
function typed(text,lt,dur=.22,size=230){const n=Math.ceil(clamp(lt/dur)*text.length);word(text.slice(0,n),lt,size,{caret:true,blink:lt<dur?false:undefined,still:true});}
function giant(text,lt){ // гигантские обрезанные буквы въезжают снизу слева
  const g=$('giant');g.style.display='block';g.textContent=text;g.style.fontSize='980px';
  const p=eExpo(seg(lt,0,.28));g.style.left='-90px';g.style.top=(1920-820*p)+'px';
}
function circle(lt){
  const c=$('circle');c.style.display='block';const p=eExpo(seg(lt,0,.3));
  c.style.width=c.style.height='1300px';c.style.left='-380px';c.style.top=(1920-620*p)+'px';
}
/* стикер со шлейфом копий: копии схлопываются в одну, лишние исчезают */
function echo(lt,html,w=860,h=300,size=190){
  const e=$('echo');const N=7;const p=eOut(seg(lt,0,.85));
  const visible=Math.max(1,Math.round(N-(N-1)*eExpo(seg(lt,.15,.9))));
  let s='';
  for(let i=N-1;i>=0;i--){
    if(i>=visible)continue;
    const d=i*(1-p*.7);
    const x=-w/2-d*34, y=-h/2-d*30;
    s+=`<div class="stk${i?' ':''}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;font-size:${size}px;transform:skewX(-8deg) rotate(-4deg);${i?'filter:brightness('+(1-i*.06)+')':''}">${html}</div>`;
  }
  e.innerHTML=s;
  e.style.transform=`translate(${(1-eExpo(seg(lt,0,.25)))*-260}px,${(1-eExpo(seg(lt,0,.25)))*-200}px)`;
}
/* шлейф наших карточек */
function cards(lt){
  $('cards').style.display='block';
  const n=CARDS.length, p=eOut(seg(lt,0,1.2));
  CARDS.forEach((c,i)=>{
    const k=n-1-i;                          // 0 — передняя (пост)
    const d=k*(1-p);
    const el=$('cd'+i);
    const show=k===0||k<Math.ceil((n-1)*(1-eExpo(seg(lt,.3,1.3))))+1;
    el.style.display=show?'block':'none';
    const c0=(n-1)*(1-p)/2;el.style.transform=`translate(${-320-(d-c0)*70}px,${-400-(d-c0)*80}px) rotate(${-5+d*1.5}deg) scale(${1+lt*.04})`;
    el.style.zIndex=10-k;
  });
}

/* ---- таймлайн ---- */
const TL=[
  [0,   .5,  t=>{reset();word('Нужно',t);}],
  [.5,  1.5, t=>{reset();echo(t-.5,'БЫСТРО');}],
  [1.5, 2,   t=>{reset();word('',t-1.5,230,{caret:true,still:true});}],
  [2,   2.5, t=>{reset();typed('Нет',t-2);}],
  [2.5, 3,   t=>{reset();giant('кон',t-2.5);word('времени',t-2.5);}],
  [3,   3.5, t=>{reset();circle(t-3);word('на',t-3,260);}],
  [3.5, 4,   t=>{reset();word('посты?',t-3.5,240);}],
  [4,   5,   t=>{reset(true);word('(бывает)',t-4,88,{top:900});}],
  [5,   5.5, t=>{reset();word('Есть',t-5,240);}],
  [5.5, 6.5, t=>{reset();echo(t-5.5,LOGO.replace('<svg','<svg width="190" height="190"')+'maker',860,300,170);}],
  [6.5, 7,   t=>{reset();word('',t-6.5,230,{caret:true,still:true});}],
  [7,   7.5, t=>{reset();typed('Пост',t-7);}],
  [7.5, 8,   t=>{reset();giant('бан',t-7.5);word('сторис',t-7.5);}],
  [8,   8.5, t=>{reset();circle(t-8);word('баннер',t-8);}],
  [8.5, 9,   t=>{reset();word('карусель',t-8.5,190);}],
  [9,   10,  t=>{reset(true);word('(из одной идеи)',t-9,88,{top:900});}],
  [10,  11.5,t=>{reset();cards(t-10);word('',0);}],
  [11.5,12,  t=>{reset();word('в вашем',t-11.5,200);}],
  [12,  12.5,t=>{reset();word('стиле',t-12,260);$('word').style.color='var(--blue)';}],
  [12.5,14,  t=>{reset();logo(t-12.5);}],
  [14,  15,  t=>{reset(true);word('(попробуйте бесплатно)',t-14,76,{top:900});}],
];
function logo(lt){
  const L=$('logo');L.style.display='flex';
  const p=eBack(seg(lt,0,.35));L.style.transform=`translateX(-50%) scale(${.5+.5*p})`;L.style.opacity=clamp(lt/.08);
  const url='trymaker.ru',n=Math.round(clamp((lt-.45)/.6)*url.length);
  $('url').innerHTML=lt>.4?url.slice(0,n)+`<span class="caret" style="opacity:${lt<1.05||Math.floor(lt/.2)%2===0?1:0}"></span>`:'&nbsp;';
}
window.render=function(t){t=clamp(t,0,DUR-1e-6);TL.find(s=>t>=s[0]&&t<s[1])[2](t);};
window.ready=async function(){
  await document.fonts.ready;
  const srcs=['ui/plan.jpg','ui/banners.jpg','ui/style.jpg','../img/intro/01-stories.jpg','../img/intro/03-carousel.jpg','../img/leaf.jpg'];
  await Promise.all(srcs.map(s=>new Promise(r=>{const i=new Image();i.onload=i.onerror=r;i.src=s;})));
  return srcs.length;
};
function fit(){const s=Math.min(innerWidth/1080,innerHeight/1920);$('stage').style.transform=`scale(${s})`;}
addEventListener('resize',fit);fit();
const q=new URLSearchParams(location.search);
if(q.has('capture')){document.body.style.display='block';$('stage').style.transform='none';render(0);}
else if(q.has('t'))render(+q.get('t'));
else ready().then(()=>{const t0=performance.now();const loop=()=>{render(((performance.now()-t0)/1000)%DUR);requestAnimationFrame(loop);};loop();});
</script>
</body>
</html>
